<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Acesso do Prestador — Orçamentos e OS</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body style="background: linear-gradient(135deg, var(--primary-900) 0%, var(--primary-700) 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-4);">

  <div style="background: white; border-radius: var(--radius-xl); box-shadow: var(--shadow-xl); width: 100%; max-width: 400px; padding: var(--space-6); text-align: center;">
    
    <div style="font-size: 3rem; margin-bottom: 8px;">⚡</div>
    <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--gray-900); margin-bottom: 4px;">
      Orçamento & OS
    </h1>
    <p style="font-size: 0.85rem; color: var(--gray-500); margin-bottom: var(--space-6);">
      Painel do Prestador e Gestão Rápida
    </p>

    <form id="login-form">
      <div class="form-group" style="text-align: left;">
        <label class="form-label" for="login-email">Seu E-mail</label>
        <input type="email" id="login-email" class="form-input" placeholder="seu@email.com" value="prestador@autocenter.com" required>
      </div>

      <div class="form-group" style="text-align: left; margin-bottom: var(--space-5);">
        <label class="form-label" for="login-password">Sua Senha</label>
        <input type="password" id="login-password" class="form-input" placeholder="••••••••" value="123456" required>
      </div>

      <button type="submit" id="btn-submit-login" class="btn-primary" style="width: 100%; padding: 12px; font-size: 1rem; border-radius: var(--radius-md);">
        Entrar no Painel
      </button>
    </form>

    <div style="margin: var(--space-5) 0 var(--space-4); position: relative;">
      <hr style="border: none; border-top: 1px solid var(--gray-200);">
      <span style="position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: white; padding: 0 10px; font-size: 0.75rem; color: var(--gray-400);">OU</span>
    </div>

    <button type="button" id="btn-enter-demo" class="btn-secondary" style="width: 100%; padding: 10px; font-size: 0.85rem; font-weight: 600; border-color: var(--primary-500); color: var(--primary-700);">
      ⚡ Entrar Direto em Modo Demonstração
    </button>

    <p style="font-size: 0.75rem; color: var(--gray-400); margin-top: var(--space-6);">
      PWA desenvolvido para agilidade no balcão e no pátio.
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    // Acesso 100% público e direto para demonstração
    localStorage.setItem('force_demo_mode', 'true');
    window.location.replace('painel.html');
  </script>
</body>
</html>
